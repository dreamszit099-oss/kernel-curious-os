<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K.E.R.N.E.L. EDU OS</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    /* Forzar que el layout ocupe toda la pantalla y sea visible */
    #main-ui { display: flex !important; visibility: visible !important; min-height: 100vh; background: #1a1a1a; }
    #sidebar-container { width: 250px; background: #2c3e50; }
    #main-content { flex: 1; background: #ffffff !important; padding: 20px; }
    /* Texto negro para asegurar legibilidad */
    #main-content * { color: #1a1a1a !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot-screen" class="boot-screen" style="position:fixed; z-index:9999; width:100%; height:100%; background:black; color:white; display:flex; align-items:center; justify-content:center; flex-direction:column;">
        <h1 style="color:white !important;">🧠 K.E.R.N.E.L.</h1>
        <p style="color:white !important;">Iniciando sistema...</p>
    </div>

    <div id="main-ui">
      <aside id="sidebar-container">
          <div id="sidebar-target"></div>
      </aside>

      <main id="main-content">
          <div id="dashboard-container"></div>
          <div id="content-display"></div>
          <div id="education-container"></div>
          <div id="content-area"></div>
      </main>
    </div>
  </div>

  <script src="js/kernel/boot.js"></script>
  <script src="js/kernel/router.js"></script>
  <script src="js/kernel/data-loader.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/modules/education-content.js"></script>
  <script src="js/app.js"></script>

  <script>
    (function() {
      console.log("K.E.R.N.E.L. Recovery System Active");

      const bypass = () => {
        // 1. Forzar cierre de pantalla de carga
        const boot = document.getElementById('boot-screen');
        if(boot) boot.style.display = 'none';

        // 2. Si el dashboard falló por ser 'undefined', re-intentamos el render manual
        const dashContainer = document.getElementById('dashboard-container');
        if(dashContainer && dashContainer.innerHTML === "") {
            console.warn("Re-intentando renderizado manual del Dashboard...");
            // Intentamos llamar a la función global si existe
            if(window.KernelRouter) {
                window.KernelRouter.render('dashboard');
            }
        }
      };

      // Ejecutar a los 3 segundos para dar tiempo a que los scripts carguen
      setTimeout(bypass, 3000);
    })();
  </script>
</body>
</html>
