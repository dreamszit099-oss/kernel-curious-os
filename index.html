<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>K.E.R.N.E.L. EDU OS</title>

  <link rel="stylesheet" href="styles/main.css"/>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: monospace;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #boot-screen {
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      gap: 12px;
    }

    #boot-screen img {
      width: 120px;
      height: auto;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- ROOT ÚNICO DEL SISTEMA -->
  <div id="app">

    <!-- BOOT SCREEN -->
    <div id="boot-screen">
      
      <!-- FIX DE RUTA (IMPORTANTE) -->
      <!-- Correcto: imagen dentro de subcarpeta -->
      <img src="images/logo.png" alt="KERNEL LOGO">

      <h1>🧠 K.E.R.N.E.L. EDU OS</h1>
      <p>Initializing system...</p>
    </div>

  </div>

  <!-- CORE SCRIPTS -->
  <script src="js/kernel/boot.js" defer></script>
  <script src="js/kernel/router.js" defer></script>
  <script src="js/kernel/data-loader.js" defer></script>

  <script src="js/ui/sidebar.js" defer></script>
  <script src="js/ui/dashboard.js" defer></script>
  <script src="js/modules/education-content.js" defer></script>

  <script src="js/app.js" defer></script>

  <!-- SAFE BOOT CONTROL -->
  <script>
    (function () {
      let booted = false;

      window.addEventListener("DOMContentLoaded", () => {
        if (booted) return;
        booted = true;

        console.log("[KERNEL] DOM Ready");

        setTimeout(() => {
          const boot = document.getElementById("boot-screen");
          if (boot) boot.classList.add("hidden");

          if (window.KernelRouter) {
            window.KernelRouter.render("dashboard");
          }

          console.log("[KERNEL] System online");
        }, 800);
      });
    })();
  </script>

</body>
</html>
