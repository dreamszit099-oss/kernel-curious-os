<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>K.E.R.N.E.L. EDU OS</title>

  <link rel="stylesheet" href="styles/main.css"/>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: monospace;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #boot-screen {
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      gap: 12px;
    }

    #boot-screen img {
      width: 120px;
      height: auto;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- ROOT ÚNICO -->
  <div id="app">

    <!-- BOOT SCREEN -->
    <div id="boot-screen">
      <img src="images/logo.png" alt="KERNEL LOGO">
      <h1>🧠 K.E.R.N.E.L. EDU OS</h1>
      <p>Initializing system...</p>

      <!-- opcional: barra de progreso -->
      <div style="width:200px;height:6px;background:#222;border-radius:4px;overflow:hidden;margin-top:10px;">
        <div class="boot-progress-bar" style="height:100%;width:0%;background:#7ee787;"></div>
      </div>
    </div>

  </div>

  <!-- ========================= -->
  <!-- CORE SYSTEM (ORDEN IMPORTA) -->
  <!-- ========================= -->

  <!-- Kernel base -->
  <script src="js/kernel/router.js" defer></script>
  <script src="js/kernel/boot.js" defer></script>
  <script src="js/kernel/data-loader.js" defer></script>

  <!-- View registry (CRÍTICO para evitar errores de rutas) -->
  <script src="js/kernel/view-registry.js" defer></script>

  <!-- UI -->
  <script src="js/ui/sidebar.js" defer></script>
  <script src="js/ui/dashboard.js" defer></script>

  <!-- Modules -->
  <script src="js/modules/education-content.js" defer></script>
  <script src="js/modules/ai.js" defer></script>
  <script src="js/modules/support.js" defer></script>

  <!-- App entry (último siempre) -->
  <script src="js/app.js" defer></script>

</body>
</html>
