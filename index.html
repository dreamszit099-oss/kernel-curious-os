<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F0F8FF">
  <title>K.E.R.N.E.L. EDU OS</title>
  <link rel="stylesheet" href="styles/main.css">
  
  <style>
    /* Forzar que el layout sea visible y el texto sea oscuro */
    #main-ui { 
      display: flex !important; 
      visibility: visible !important; 
      min-height: 100vh;
      background: #f0f0f0; 
    }
    
    #sidebar-container {
      width: 260px;
      background: #1e90ff; /* Color acorde a tu logo */
      min-height: 100vh;
    }

    /* El área donde DEBERÍA verse la info */
    #main-content, .main-content, #content-area { 
      flex: 1;
      padding: 20px;
      background: white !important;
      color: #333 !important;
      min-height: 100vh;
    }

    /* Estilo preventivo para que el texto inyectado no sea blanco */
    main * { color: #333 !important; }
  </style>
</head>
<body>

  <div id="app">
    <div id="boot-screen" class="boot-screen">
      <div class="boot-content">
        <div class="boot-logo">🧠</div>
        <div class="boot-text">K.E.R.N.E.L. EDU OS</div>
        <div class="boot-progress"><div class="boot-progress-bar"></div></div>
      </div>
    </div>

    <div id="main-ui" class="main-ui">
      
      <aside id="sidebar-container">
          <div id="sidebar-target"></div>
      </aside>

      <main id="main-content" class="main-content">
        
        <div id="dashboard-container"></div>
        <div id="content-area"></div>
        <div id="education-container"></div>
        
        <div id="fallback-message" style="text-align:center; padding-top:50px;">
            <h3>Sincronizando con el Kernel...</h3>
            <p>Si la pantalla sigue blanca, el error está en la línea 54 de tu dashboard.js</p>
        </div>
      </main>

    </div>
  </div>

  <script src="js/kernel/boot.js"></script>
  <script src="js/kernel/router.js"></script>
  <script src="js/kernel/data-loader.js"></script>
  
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/modules/education-content.js"></script>
  
  <script src="js/app.js"></script>

  <script>
    window.onload = () => {
      // Si a los 3 segundos sigue el mensaje de carga, quitamos el protector manualmente
      setTimeout(() => {
        const boot = document.getElementById('boot-screen');
        if(boot) boot.style.display = 'none';
        
        const main = document.getElementById('main-ui');
        if(main) main.classList.remove('hidden');
        
        console.log("K.E.R.N.E.L. Recovery: Bypass de pantalla de carga ejecutado.");
      }, 3000);
    };
  </script>
</body>
</html>
