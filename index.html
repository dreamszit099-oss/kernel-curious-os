<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>K.E.R.N.E.L. EDU OS</title>

  <link rel="stylesheet" href="styles/main.css"/>

  <style>
    /* Base OS layout */
    body {
      margin: 0;
      background: #0b0f14;
      font-family: monospace;
      overflow: hidden;
    }

    /* Single app root (CRÍTICO) */
    #app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Boot overlay */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }

    /* Optional UI polish */
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- 🔥 SINGLE ROOT (OBLIGATORIO PARA EL ROUTER) -->
  <div id="app">

    <!-- BOOT SCREEN -->
    <div id="boot-screen">
      <h1>🧠 K.E.R.N.E.L. EDU OS</h1>
      <p>Initializing system...</p>
    </div>

    <!-- Router will inject EVERYTHING here -->
  </div>

  <!-- ========================= -->
  <!-- SCRIPTS (ORDER CRÍTICO)   -->
  <!-- ========================= -->

  <script src="js/kernel/boot.js" defer></script>
  <script src="js/kernel/router.js" defer></script>
  <script src="js/kernel/data-loader.js" defer></script>

  <script src="js/ui/sidebar.js" defer></script>
  <script src="js/ui/dashboard.js" defer></script>
  <script src="js/modules/education-content.js" defer></script>

  <script src="js/app.js" defer></script>

  <!-- ========================= -->
  <!-- BOOT CONTROL (SAFE)       -->
  <!-- ========================= -->
  <script>
    (function () {
      let bootDone = false;

      window.addEventListener("DOMContentLoaded", () => {
        console.log("[KERNEL] DOM ready");

        // evita doble ejecución
        if (bootDone) return;
        bootDone = true;

        setTimeout(() => {
          const boot = document.getElementById("boot-screen");
          if (boot) boot.classList.add("hidden");

          // render inicial controlado SOLO por router
          if (window.KernelRouter) {
            window.KernelRouter.render("dashboard");
          }

          console.log("[KERNEL] System ready");
        }, 800);
      });
    })();
  </script>

</body>
</html>
