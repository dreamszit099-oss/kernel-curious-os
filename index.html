<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K.E.R.N.E.L. EDU OS</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    /* Forzar visibilidad y colores oscuros para evitar 'tinta invisible' */
    #main-ui { display: flex !important; visibility: visible !important; min-height: 100vh; background: #f4f4f4; }
    #sidebar-container { width: 250px; background: #2c3e50; color: white; }
    #main-content { flex: 1; background: white !important; color: #1a1a1a !important; padding: 20px; }
    /* Estilo para que cualquier cosa dentro del contenido sea negra */
    #main-content *, #dashboard-container * { color: #1a1a1a !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot-screen" class="boot-screen">
      <div class="boot-content">
        <div class="boot-logo">🧠</div>
        <div class="boot-text">K.E.R.N.E.L. EDU OS</div>
        <div class="boot-progress"><div class="boot-progress-bar"></div></div>
      </div>
    </div>

    <div id="main-ui" class="main-ui">
      
      <aside id="sidebar-container">
        <div id="sidebar-target"></div>
      </aside>

      <main id="main-content">
        
        <div id="dashboard-container"></div>
        
        <div id="content-display"></div>
        
        <div id="education-container"></div>

        <div id="loading-placeholder" style="text-align:center; padding-top:100px;">
          <h2>Sincronizando con K.E.R.N.E.L....</h2>
          <p>Si ves esto, los IDs ya están presentes. El sistema está intentando inyectar los datos.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="js/kernel/boot.js"></script>
  <script src="js/kernel/router.js"></script>
  <script src="js/kernel/data-loader.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/modules/education-content.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Este pequeño script crea los elementos si el router se olvida de ellos
    (function() {
      const checkAndFix = () => {
        const main = document.getElementById('main-content');
        if (main) {
          // Si dashboard.js no encuentra su ID, lo creamos a la fuerza
          if (!document.getElementById('dashboard-container')) {
            const dash = document.createElement('div');
            dash.id = 'dashboard-container';
            main.appendChild(dash);
          }
        }
      };
      
      // Ejecutar inmediatamente y a los 2 segundos
      checkAndFix();
      setTimeout(checkAndFix, 2000);

      // Bypass de la pantalla de boot si se queda trabada
      setTimeout(() => {
        const boot = document.getElementById('boot-screen');
        if (boot) boot.style.display = 'none';
      }, 4000);
    })();
  </script>
</body>
</html>
